<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Family">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Family Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #f6f7f9; --surface: rgba(255,255,255,.92); --surface-solid: #fff; --fg: #101828; --muted: #667085;
    --line: rgba(16,24,40,.08); --shadow: 0 8px 30px rgba(16,24,40,.14); --accent: #2563eb;
    --ok: #12b76a; --warn: #f79009; --bad: #f04438; --radius: 18px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0f14; --surface: rgba(22,28,36,.9); --surface-solid: #161c24; --fg: #eef1f5; --muted: #98a2b3;
            --line: rgba(255,255,255,.09); --shadow: 0 8px 30px rgba(0,0,0,.5); }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { height: 100%; margin: 0; overscroll-behavior: none; }
  body { font-family: "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg); overflow: hidden; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px); }
  noscript { position: fixed; inset: 0; z-index: 3000; display: grid; place-items: center; padding: 24px; text-align: center; background: var(--bg); }
  #map { position: fixed; inset: 0; z-index: 0; background: var(--bg); }

  .glass { background: var(--surface); backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
           border: 1px solid var(--line); box-shadow: var(--shadow); }

  /* top bar */
  .topbar { position: fixed; z-index: 500; top: calc(12px + var(--sat)); left: calc(12px + var(--sal)); right: calc(12px + var(--sar)); display: flex; align-items: center; gap: 6px;
            padding: 8px 8px 8px 16px; border-radius: 999px; max-width: 560px; }
  .brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
  .brand .logo { width: 30px; height: 30px; border-radius: 10px; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
  .brand h1 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.1; }
  .brand small { display: block; color: var(--muted); font-size: 12px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; transition: background .15s; }
  .icon-btn:hover { background: var(--line); }
  .icon-btn:active { background: var(--line); transform: scale(.94); }
  .icon-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* people panel: bottom sheet on phones, side card on wide screens */
  .panel { position: fixed; z-index: 500; left: calc(12px + var(--sal)); right: calc(12px + var(--sar)); bottom: calc(12px + var(--sab)); border-radius: var(--radius); padding: 10px;
           max-height: 42vh; max-height: 42dvh; overflow: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px 10px; color: var(--muted); font-size: 13px; }
  .panel-head b { color: var(--fg); font-weight: 600; }
  .people { display: grid; gap: 6px; }
  .person { display: flex; align-items: center; gap: 4px; width: 100%; border-radius: 14px; transition: background .15s; }
  .person:hover { background: var(--line); }
  .person-main { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; text-align: left; padding: 10px 0 10px 10px; border-radius: 14px; }
  .ask { margin-right: 4px; color: var(--muted); }
  .ask:disabled { cursor: default; opacity: .8; color: var(--accent); }
  .avatar { position: relative; width: 44px; height: 44px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 18px; display: grid; place-items: center; flex: none; }
  .avatar::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 13px; height: 13px; border-radius: 50%; background: var(--st, var(--ok)); border: 2.5px solid var(--surface-solid); }
  .info { flex: 1; min-width: 0; }
  .info strong { display: block; font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info span { display: block; color: var(--muted); font-size: 13px; }
  .batt { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; flex: none; }
  .batt i { position: relative; width: 24px; height: 12px; border-radius: 3.5px; border: 1.5px solid currentColor; opacity: .85; }
  .batt i::before { content: ""; position: absolute; left: 1.5px; top: 1.5px; bottom: 1.5px; width: calc((100% - 3px) * var(--lvl, 0)); background: var(--bc, currentColor); border-radius: 1.5px; }
  .batt i::after { content: ""; position: absolute; right: -4.5px; top: 2.5px; width: 2.5px; height: 4px; background: currentColor; border-radius: 0 1px 1px 0; }
  .empty { text-align: center; color: var(--muted); padding: 18px 8px; font-size: 14px; }
  .person.stale .avatar { filter: grayscale(.85); opacity: .75; }

  /* tablets, desktops and phones held sideways: the list becomes a card on the left */
  @media (min-width: 760px), (orientation: landscape) and (max-height: 520px) {
    .panel { left: calc(12px + var(--sal)); right: auto; bottom: auto; top: calc(76px + var(--sat)); width: 340px; max-width: calc(100vw - 24px);
             max-height: calc(100vh - 100px - var(--sat) - var(--sab)); max-height: calc(100dvh - 100px - var(--sat) - var(--sab)); }
  }
  @media (min-width: 1200px) { .panel { width: 380px; } .topbar { max-width: 600px; } }
  @media (max-width: 360px) { .brand small { display: none; } .icon-btn { width: 40px; height: 40px; } }
  @media (prefers-reduced-motion: reduce) { .pin .pulse, .spin svg { animation: none; } .icon-btn, .person { transition: none; } }
  @media (forced-colors: active) { .glass { border: 1px solid CanvasText; } }
  /* browsers without backdrop blur get a solid surface so text stays readable */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    :root { --surface: var(--surface-solid); }
  }

  /* map markers */
  .pin { position: relative; width: 40px; height: 40px; }
  .pin .dot { position: absolute; inset: 0; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 3px 10px rgba(0,0,0,.35); color: #fff; font-weight: 700; font-size: 16px; display: grid; place-items: center; }
  .pin .pulse { position: absolute; inset: 0; border-radius: 50%; background: var(--c); opacity: .35; animation: pulse 2.2s ease-out infinite; }
  .pin.stale .pulse { display: none; }
  @keyframes pulse { 0% { transform: scale(1); opacity: .45; } 100% { transform: scale(2.4); opacity: 0; } }
  .leaflet-popup-content-wrapper { border-radius: 14px; background: var(--surface-solid); color: var(--fg); }
  .leaflet-popup-tip { background: var(--surface-solid); }
  .leaflet-popup-content { margin: 12px 14px; font-family: inherit; font-size: 14px; line-height: 1.45; }
  .leaflet-tile-pane { filter: saturate(.85) contrast(.96); }
  @media (prefers-color-scheme: dark) { .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.88) saturate(.7); } }
  .leaflet-control-zoom { display: none; }
  .leaflet-control-attribution { font-size: 10px; background: var(--surface) !important; color: var(--muted) !important; }
  .leaflet-control-attribution a { color: var(--muted) !important; }

  /* login */
  #login { position: fixed; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(8,12,18,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #login form { width: 100%; max-width: 360px; background: var(--surface-solid); border-radius: 22px; padding: 26px 22px 22px; display: grid; gap: 14px; box-shadow: var(--shadow); text-align: center; }
  #login .logo { width: 52px; height: 52px; border-radius: 16px; background: var(--accent); color: #fff; display: grid; place-items: center; margin: 0 auto; }
  #login .logo svg { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #login h2 { margin: 0; font-size: 18px; }
  #login p.sub { margin: -6px 0 0; color: var(--muted); font-size: 14px; }
  #login input { font: inherit; font-size: 16px; /* 16px stops iOS Safari from zooming the page on focus */ padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--fg); text-align: center; }
  #login input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  #login .err { margin: 0; color: var(--bad); min-height: 1.3em; font-size: 14px; }
  #login .go { background: var(--accent); color: #fff; padding: 13px; border-radius: 12px; font-weight: 600; }
</style>
</head>
<body>
<noscript>ต้องเปิด JavaScript เพื่อดูแผนที่</noscript>
<div id="map"></div>

<header class="topbar glass">
  <div class="brand">
    <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></div>
    <div><h1>Family Tracker</h1><small id="status" role="status" aria-live="polite">กำลังเชื่อมต่อ…</small></div>
  </div>
  <button class="icon-btn" id="fit" type="button" aria-label="ดูทุกคนบนแผนที่" title="ดูทุกคน"><svg viewBox="0 0 24 24"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/></svg></button>
  <button class="icon-btn" id="refresh" type="button" aria-label="รีเฟรช" title="รีเฟรช"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg></button>
  <button class="icon-btn" id="logout" type="button" aria-label="ออกจากระบบ" title="ออก"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
</header>

<section class="panel glass" aria-label="รายชื่อสมาชิก">
  <div class="panel-head"><span><b id="count">0</b> คน</span><span id="updated"></span></div>
  <div class="people" id="people"></div>
</section>

<div id="login">
  <form id="loginForm">
    <div class="logo"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
    <h2>Family Tracker</h2>
    <p class="sub">ใส่ Token เพื่อดูตำแหน่งสมาชิก</p>
    <input id="token" type="password" autocomplete="current-password" placeholder="Token" required>
    <p class="err" id="loginError"></p>
    <button class="go" type="submit">เข้าดู</button>
  </form>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  var API = 'https://api.drivetodev.online/owntracks/latest';
  var REFRESH_MS = 30000, STALE_MS = 3600000, LIVE_MS = 600000;
  var KEY = 'familytracker.token', COLORS_KEY = 'familytracker.colors';
  var PALETTE = ['#2563eb', '#e11d48', '#16a34a', '#f59e0b', '#9333ea', '#0891b2', '#ea580c', '#db2777'];
  var $ = function (id) { return document.getElementById(id); };

  if (typeof L === 'undefined') {   // Leaflet's CDN is blocked or offline
    $('status').textContent = 'โหลดแผนที่ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วรีเฟรช';
    $('login').style.display = 'none';
    return;
  }

  var map = L.map('map', { zoomControl: false, attributionControl: true }).setView([13.75, 100.5], 11);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);

  var markers = {}, circles = {}, points = {}, firstFit = true, colors = {};
  try { colors = JSON.parse(localStorage.getItem(COLORS_KEY) || '{}') || {}; } catch (e) { colors = {}; }

  function getToken() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function setToken(t) { try { t ? localStorage.setItem(KEY, t) : localStorage.removeItem(KEY); } catch (e) {} }
  function showLogin(msg) { $('loginError').textContent = msg || ''; $('login').style.display = 'flex'; $('token').focus(); }

  // Each person keeps one colour: the first palette colour nobody else uses yet, remembered per browser.
  function colorFor(name) {
    if (colors[name]) return colors[name];
    var used = Object.keys(colors).map(function (k) { return colors[k]; });
    colors[name] = PALETTE.filter(function (c) { return used.indexOf(c) < 0; })[0] || PALETTE[Object.keys(colors).length % PALETTE.length];
    try { localStorage.setItem(COLORS_KEY, JSON.stringify(colors)); } catch (e) {}
    return colors[name];
  }
  function initial(name) { return (Array.from(name)[0] || '?').toUpperCase(); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function ago(ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return 'เมื่อสักครู่';
    if (s < 3600) return Math.round(s / 60) + ' นาทีที่แล้ว';
    if (s < 86400) return Math.round(s / 3600) + ' ชม.ที่แล้ว';
    return Math.round(s / 86400) + ' วันที่แล้ว';
  }
  function state(p) {
    var age = Date.now() - new Date(p.recordedAt).getTime();
    return { age: age, stale: age > STALE_MS, live: age <= LIVE_MS };
  }
  function battColor(b) { return b <= 15 ? 'var(--bad)' : b <= 30 ? 'var(--warn)' : 'var(--ok)'; }

  function pinIcon(p, color, st) {
    var wrap = el('div', 'pin' + (st.stale ? ' stale' : '')); wrap.style.setProperty('--c', color);
    wrap.appendChild(el('div', 'pulse'));
    var dot = el('div', 'dot', initial(p.name)); dot.style.background = st.stale ? '#94a3b8' : color;
    wrap.appendChild(dot);
    return L.divIcon({ html: wrap, className: '', iconSize: [40, 40], iconAnchor: [20, 20], popupAnchor: [0, -22] });
  }

  function popup(p, st) {
    var box = el('div');
    box.appendChild(el('strong', null, p.name));
    box.appendChild(el('div', null, ago(st.age) + (p.battery != null ? ' · แบต ' + p.battery + '%' : '')));
    if (p.accuracy != null) box.appendChild(el('div', null, 'ความแม่นยำ ±' + p.accuracy + ' ม.'));
    var a = el('a', null, 'เปิดใน Google Maps');
    a.href = 'https://www.google.com/maps?q=' + p.lat + ',' + p.lon; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.style.cssText = 'color:#2563eb;display:inline-block;margin-top:4px';
    box.appendChild(a);
    return box;
  }

  function render(rows) {
    var list = $('people'), seen = {}, bounds = [];
    list.textContent = '';
    rows.forEach(function (p) {
      seen[p.name] = true;
      var ll = [p.lat, p.lon], st = state(p), color = colorFor(p.name);
      bounds.push(ll); points[p.name] = ll;

      if (!markers[p.name]) markers[p.name] = L.marker(ll).addTo(map);
      markers[p.name].setLatLng(ll).setIcon(pinIcon(p, color, st)).bindPopup(popup(p, st));
      if (p.accuracy != null) {
        if (!circles[p.name]) circles[p.name] = L.circle(ll, { weight: 1, opacity: .5, fillOpacity: .08, interactive: false }).addTo(map);
        circles[p.name].setLatLng(ll).setRadius(p.accuracy).setStyle({ color: st.stale ? '#94a3b8' : color, fillColor: st.stale ? '#94a3b8' : color });
      }

      var row = el('div', 'person' + (st.stale ? ' stale' : ''));
      var main = el('button', 'person-main'); main.type = 'button';
      var av = el('div', 'avatar', initial(p.name)); av.style.background = color;
      av.style.setProperty('--st', st.live ? 'var(--ok)' : st.stale ? '#98a2b3' : 'var(--warn)');
      var info = el('div', 'info'); info.appendChild(el('strong', null, p.name));
      info.appendChild(el('span', null, p.requested ? 'รอเครื่องตอบกลับ…' : (st.live ? 'ออนไลน์ · ' : '') + ago(st.age)));
      main.appendChild(av); main.appendChild(info);
      if (p.battery != null) {
        var b = el('div', 'batt'); var ic = el('i');
        ic.style.setProperty('--lvl', Math.max(0, Math.min(100, p.battery)) / 100); ic.style.setProperty('--bc', battColor(p.battery));
        b.appendChild(ic); b.appendChild(el('span', null, p.battery + '%')); main.appendChild(b);
      }
      main.addEventListener('click', function () { map.flyTo(ll, 16, { duration: .8 }); markers[p.name].openPopup(); });
      row.appendChild(main);

      var ask = el('button', 'icon-btn ask' + (p.requested ? ' spin' : '')); ask.type = 'button';
      ask.title = ask.ariaLabel = 'ขอตำแหน่ง ' + p.name + ' ตอนนี้'; ask.disabled = !!p.requested;
      ask.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>';
      ask.addEventListener('click', function () { requestLocation(p.name, ask); });
      row.appendChild(ask);
      list.appendChild(row);
    });
    Object.keys(markers).forEach(function (k) {
      if (!seen[k]) { map.removeLayer(markers[k]); delete markers[k]; delete points[k]; if (circles[k]) { map.removeLayer(circles[k]); delete circles[k]; } }
    });
    $('count').textContent = rows.length;
    if (!rows.length) list.appendChild(el('div', 'empty', 'ยังไม่มีข้อมูลตำแหน่ง'));
    if (firstFit && bounds.length) { fitAll(); firstFit = false; }
  }

  function fitAll() {
    var pts = Object.keys(points).map(function (k) { return points[k]; });
    if (!pts.length) return;
    var sideCard = matchMedia('(min-width: 760px), (orientation: landscape) and (max-height: 520px)').matches;
    var pad = sideCard ? { paddingTopLeft: [380, 90], paddingBottomRight: [50, 50] } : { paddingTopLeft: [40, 90], paddingBottomRight: [40, Math.round(window.innerHeight * .45)] };
    map.fitBounds(pts, Object.assign({ maxZoom: 16 }, pad));
  }

  // Ask a person's phone to report now; it answers on its next post, so the list shows "waiting" and refreshes faster meanwhile.
  var fastTimer = null;
  function requestLocation(name, btn) {
    var token = getToken(); if (!token) { showLogin(); return; }
    btn.disabled = true;
    fetch('https://api.drivetodev.online/owntracks/request?name=' + encodeURIComponent(name) + '&key=' + encodeURIComponent(token), { method: 'POST' })
      .then(function (r) {
        if (r.status === 401) { setToken(''); showLogin('Token ไม่ถูกต้อง'); return; }
        if (!r.ok) throw new Error('HTTP ' + r.status);
        $('status').textContent = 'ส่งคำขอไปที่ ' + name + ' แล้ว รอเครื่องตอบกลับ';
        return refresh();
      })
      .catch(function () { btn.disabled = false; $('status').textContent = 'ส่งคำขอไม่สำเร็จ'; });
  }
  function scheduleFast(rows) {
    clearTimeout(fastTimer);
    if (rows.some(function (p) { return p.requested; })) fastTimer = setTimeout(function () { if (!document.hidden) refresh(); }, 10000);
  }

  function refresh() {
    var token = getToken();
    if (!token) { showLogin(); return Promise.resolve(); }
    $('refresh').classList.add('spin');
    return fetch(API + '?key=' + encodeURIComponent(token)).then(function (r) {
      if (r.status === 401) { setToken(''); showLogin('Token ไม่ถูกต้อง'); throw new Error('401'); }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (rows) {
      render(rows); scheduleFast(rows);
      var t = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
      $('status').textContent = 'อัปเดตล่าสุด ' + t; $('updated').textContent = 'รีเฟรชทุก 30 วิ';
    }).catch(function (e) {
      if (e.message !== '401') $('status').textContent = 'โหลดไม่สำเร็จ ลองใหม่อีกครั้ง';
    }).then(function () { $('refresh').classList.remove('spin'); });
  }
  window.__refreshTracker = refresh;

  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    setToken($('token').value.trim()); $('token').value = '';
    $('login').style.display = 'none'; refresh();
  });
  $('refresh').addEventListener('click', refresh);
  $('fit').addEventListener('click', fitAll);
  $('logout').addEventListener('click', function () { setToken(''); firstFit = true; render([]); $('status').textContent = 'ออกจากระบบแล้ว'; showLogin(); });
  setInterval(function () { if (!document.hidden) refresh(); }, REFRESH_MS);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(); });
  // mobile browsers resize the viewport when the address bar hides or the phone rotates
  var resizeTimer;
  function onResize() { clearTimeout(resizeTimer); resizeTimer = setTimeout(function () { map.invalidateSize(); }, 120); }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  if (window.visualViewport) visualViewport.addEventListener('resize', onResize);
  window.addEventListener('load', function () { map.invalidateSize(); });
  refresh();
})();
</script>
</body>
