<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Family Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --bg:#fff; --fg:#1b2430; --muted:#667085; --line:#e4e7ec; --accent:#2563eb; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#10151c; --fg:#e6e9ee; --muted:#98a2b3; --line:#27303c; --card:#171e27; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: "IBM Plex Sans Thai", system-ui, sans-serif; background: var(--bg); color: var(--fg); display: flex; flex-direction: column; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; flex:1; }
  header small { color: var(--muted); }
  button { font: inherit; border:1px solid var(--line); background: var(--card); color: var(--fg); border-radius:8px; padding:6px 12px; cursor:pointer; }
  main { flex:1; display:flex; min-height:0; }
  #map { flex:1; min-width:0; }
  aside { width:280px; overflow:auto; border-left:1px solid var(--line); background: var(--card); }
  .person { display:block; width:100%; text-align:left; border:0; border-bottom:1px solid var(--line); border-radius:0; padding:12px 16px; }
  .person strong { display:block; }
  .person span { color: var(--muted); font-size:13px; }
  .stale { opacity:.55; }
  #login { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.45); z-index:1000; padding:16px; }
  #login form { background:var(--card); padding:20px; border-radius:12px; width:100%; max-width:340px; display:grid; gap:12px; }
  #login input { font:inherit; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); }
  #login p { margin:0; color:#d92d20; min-height:1.2em; font-size:14px; }
  @media (max-width: 720px) { main { flex-direction:column; } aside { width:auto; max-height:34%; border-left:0; border-top:1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>Family Tracker <small id="status"></small></h1>
  <button id="refresh" type="button">รีเฟรช</button>
  <button id="logout" type="button">ออก</button>
</header>
<main>
  <div id="map"></div>
  <aside id="people"></aside>
</main>
<div id="login">
  <form id="loginForm">
    <strong>ใส่ Token เพื่อดูตำแหน่ง</strong>
    <input id="token" type="password" autocomplete="current-password" placeholder="Token" required>
    <p id="loginError"></p>
    <button type="submit">เข้าดู</button>
  </form>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  var API = 'https://api.drivetodev.online/owntracks/latest';
  var REFRESH_MS = 30000, STALE_MS = 3600000;
  var KEY = 'familytracker.token';
  var map = L.map('map').setView([13.75, 100.5], 11);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
  var markers = {}, circles = {}, firstFit = true, timer = null;
  var $ = function (id) { return document.getElementById(id); };

  function getToken() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  function setToken(t) { try { t ? localStorage.setItem(KEY, t) : localStorage.removeItem(KEY); } catch (e) {} }
  function showLogin(msg) { $('loginError').textContent = msg || ''; $('login').style.display = 'flex'; $('token').focus(); }

  function ago(ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return 'เมื่อสักครู่';
    if (s < 3600) return Math.round(s / 60) + ' นาทีที่แล้ว';
    if (s < 86400) return Math.round(s / 3600) + ' ชม.ที่แล้ว';
    return Math.round(s / 86400) + ' วันที่แล้ว';
  }
  function describe(p) {
    var parts = [ago(Date.now() - new Date(p.recordedAt).getTime())];
    if (p.battery != null) parts.push('แบต ' + p.battery + '%');
    if (p.accuracy != null) parts.push('±' + p.accuracy + ' ม.');
    return parts.join(' · ');
  }

  function render(rows) {
    var list = $('people'), seen = {};
    list.textContent = '';
    var bounds = [];
    rows.forEach(function (p) {
      seen[p.name] = true;
      var ll = [p.lat, p.lon], stale = Date.now() - new Date(p.recordedAt).getTime() > STALE_MS;
      bounds.push(ll);
      if (!markers[p.name]) markers[p.name] = L.marker(ll).addTo(map);
      markers[p.name].setLatLng(ll).bindPopup(document.createTextNode(p.name + ' — ' + describe(p)));
      markers[p.name].setOpacity(stale ? 0.5 : 1);
      if (p.accuracy != null) {
        if (!circles[p.name]) circles[p.name] = L.circle(ll, { radius: p.accuracy, weight: 1, opacity: .4, fillOpacity: .08 }).addTo(map);
        circles[p.name].setLatLng(ll).setRadius(p.accuracy);
      }
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'person' + (stale ? ' stale' : '');
      var n = document.createElement('strong'); n.textContent = p.name;
      var d = document.createElement('span'); d.textContent = describe(p);
      b.appendChild(n); b.appendChild(d);
      b.addEventListener('click', function () { map.setView(ll, 16); markers[p.name].openPopup(); });
      list.appendChild(b);
    });
    Object.keys(markers).forEach(function (k) {
      if (!seen[k]) { map.removeLayer(markers[k]); delete markers[k]; if (circles[k]) { map.removeLayer(circles[k]); delete circles[k]; } }
    });
    if (!rows.length) list.textContent = 'ยังไม่มีข้อมูลตำแหน่ง';
    if (firstFit && bounds.length) { map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 }); firstFit = false; }
  }

  function refresh() {
    var token = getToken();
    if (!token) { showLogin(); return Promise.resolve(); }
    $('status').textContent = 'กำลังโหลด…';
    return fetch(API + '?key=' + encodeURIComponent(token)).then(function (r) {
      if (r.status === 401) { setToken(''); showLogin('Token ไม่ถูกต้อง'); throw new Error('401'); }
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (rows) {
      render(rows);
      $('status').textContent = 'อัปเดต ' + new Date().toLocaleTimeString('th-TH');
    }).catch(function (e) {
      if (e.message !== '401') $('status').textContent = 'โหลดไม่สำเร็จ';
    });
  }
  window.__refreshTracker = refresh;

  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    setToken($('token').value.trim()); $('token').value = '';
    $('login').style.display = 'none'; refresh();
  });
  $('refresh').addEventListener('click', refresh);
  $('logout').addEventListener('click', function () { setToken(''); firstFit = true; render([]); showLogin(); });
  timer = setInterval(function () { if (!document.hidden) refresh(); }, REFRESH_MS);
  refresh();
})();
</script>
</body>
</html>
