<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Family">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Family Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #f6f7f9; --surface: rgba(255,255,255,.92); --surface-solid: #fff; --fg: #101828; --muted: #667085;
    --line: rgba(16,24,40,.08); --shadow: 0 8px 30px rgba(16,24,40,.14); --accent: #2563eb;
    --ok: #12b76a; --warn: #f79009; --bad: #f04438; --radius: 18px;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
    --sheet-h: 0px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0f14; --surface: rgba(22,28,36,.9); --surface-solid: #161c24; --fg: #eef1f5; --muted: #98a2b3;
            --line: rgba(255,255,255,.09); --shadow: 0 8px 30px rgba(0,0,0,.5); }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { height: 100%; margin: 0; overscroll-behavior: none; }
  body { font-family: "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg); overflow: hidden; -webkit-font-smoothing: antialiased;
         -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  noscript { position: fixed; inset: 0; z-index: 3000; display: grid; place-items: center; padding: 24px; text-align: center; background: var(--bg); }
  #map { position: fixed; inset: 0; z-index: 0; background: var(--bg); }

  .glass { background: var(--surface); backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4);
           border: 1px solid var(--line); box-shadow: var(--shadow); }

  /* ---- title pill (top-left) ---- */
  .topbar { position: fixed; z-index: 900; top: calc(12px + var(--sat)); left: calc(12px + var(--sal)); display: flex; align-items: center; gap: 10px;
            padding: 8px 18px 8px 8px; border-radius: 999px; max-width: calc(100vw - 88px - var(--sal) - var(--sar)); }
  .logo { width: 36px; height: 36px; border-radius: 12px; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
  .brand { min-width: 0; }
  .brand h1 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.15; }
  .brand small { display: block; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---- floating round buttons (top-right) ---- */
  .fabs { position: fixed; z-index: 900; top: calc(12px + var(--sat)); right: calc(12px + var(--sar)); display: flex; flex-direction: column; gap: 10px; }
  .fab { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; transition: transform .12s; }
  .fab:active { transform: scale(.92); }
  .icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none; transition: background .15s; }
  .icon-btn:hover { background: var(--line); }
  .icon-btn:active { background: var(--line); transform: scale(.94); }
  .fab svg, .icon-btn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- people: a bottom sheet on phones, a card on wide screens ---- */
  .panel { position: fixed; z-index: 900; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; height: var(--sheet-h);
           border-radius: 26px 26px 0 0; border-bottom: 0; padding: 0 calc(8px + var(--sar)) var(--sab) calc(8px + var(--sal)); transition: height .28s cubic-bezier(.2,.8,.2,1); }
  .panel.dragging { transition: none; }
  .grab { flex: none; display: grid; place-items: center; height: 26px; cursor: grab; touch-action: none; }
  .grab span { width: 40px; height: 5px; border-radius: 3px; background: var(--muted); opacity: .45; }
  .panel-head { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 8px; color: var(--muted); font-size: 13px; touch-action: none; }
  .panel-head b { color: var(--fg); font-weight: 600; font-size: 15px; }
  .people { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; display: grid; gap: 4px; align-content: start; padding-bottom: 8px; }
  .person { display: flex; align-items: center; gap: 4px; width: 100%; border-radius: 16px; transition: background .15s; }
  .person:hover { background: var(--line); }
  .person-main { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; text-align: left; padding: 10px 0 10px 10px; border-radius: 16px; }
  .person .icon-btn { width: 40px; height: 40px; }
  .person .icon-btn:last-child { margin-right: 4px; }
  .ask { color: var(--muted); }
  .info .dist { color: var(--accent); font-weight: 500; }
  .ask:disabled { cursor: default; opacity: .85; color: var(--accent); }
  .avatar { position: relative; width: 52px; height: 52px; border-radius: 50%; color: #fff; font-weight: 700; font-size: 20px; display: grid; place-items: center; flex: none; }
  .avatar::after { content: ""; position: absolute; right: -1px; bottom: -1px; width: 14px; height: 14px; border-radius: 50%; background: var(--st, var(--ok)); border: 2.5px solid var(--surface-solid); }
  .info { flex: 1; min-width: 0; }
  .info strong { display: block; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info span { display: block; color: var(--muted); font-size: 13px; }
  .batt { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; flex: none; }
  .batt i { position: relative; width: 24px; height: 12px; border-radius: 3.5px; border: 1.5px solid currentColor; opacity: .85; }
  .batt i::before { content: ""; position: absolute; left: 1.5px; top: 1.5px; bottom: 1.5px; width: calc((100% - 3px) * var(--lvl, 0)); background: var(--bc, currentColor); border-radius: 1.5px; }
  .batt i::after { content: ""; position: absolute; right: -4.5px; top: 2.5px; width: 2.5px; height: 4px; background: currentColor; border-radius: 0 1px 1px 0; }
  .empty { text-align: center; color: var(--muted); padding: 18px 8px; font-size: 14px; }
  .person.stale .avatar { filter: grayscale(.85); opacity: .75; }

  /* tablets, desktops and phones held sideways: the list is a floating card on the left, no dragging */
  @media (min-width: 760px), (orientation: landscape) and (max-height: 520px) {
    .panel { left: calc(12px + var(--sal)); right: auto; bottom: auto; top: calc(76px + var(--sat)); width: 360px; max-width: calc(100vw - 24px);
             height: auto; max-height: calc(100vh - 100px - var(--sat) - var(--sab)); max-height: calc(100dvh - 100px - var(--sat) - var(--sab));
             border-radius: var(--radius); border-bottom: 1px solid var(--line); padding: 10px; transition: none; }
    .grab { display: none; }
    .panel-head { touch-action: auto; padding-top: 4px; }
    .avatar { width: 44px; height: 44px; font-size: 18px; }
    .person-main { gap: 12px; }
  }
  @media (min-width: 1200px) { .panel { width: 400px; } }
  @media (max-width: 360px) { .brand small { display: none; } }
  @media (prefers-reduced-motion: reduce) { .pin .pulse, .spin svg { animation: none; } .icon-btn, .person, .panel, .fab { transition: none; } }
  @media (forced-colors: active) { .glass { border: 1px solid CanvasText; } }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { :root { --surface: var(--surface-solid); } }

  /* ---- silence warnings ---- */
  #silentCount { color: var(--warn); font-weight: 600; margin-left: 6px; }
  .alerts { flex: none; display: grid; gap: 6px; padding: 0 4px 6px; }
  .alerts:empty { display: none; }
  .alert { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; border-radius: 14px; background: color-mix(in srgb, var(--warn) 16%, transparent); font-size: 13px; line-height: 1.35; }
  .alert svg { flex: none; width: 18px; height: 18px; stroke: var(--warn); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .alert span { flex: 1; min-width: 0; }
  .alert button { flex: none; padding: 6px 12px; border-radius: 999px; background: var(--surface-solid); border: 1px solid var(--line); font-size: 13px; font-weight: 500; }
  .alert button:disabled { opacity: .6; }

  /* ---- history ---- */
  .history { flex: 1; min-height: 0; overflow-y: auto; padding: 0 6px 10px; display: grid; gap: 10px; align-content: start; }
  .history[hidden] { display: none; }
  .panel.hist .people, .panel.hist .alerts, .panel.hist .panel-head { display: none; }
  .hist-bar { display: flex; align-items: center; gap: 6px; }
  .hist-bar strong { font-size: 17px; }
  .hist-date { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .hist-date input { flex: 1; min-width: 0; font: inherit; font-size: 16px; text-align: center; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-solid); color: var(--fg); }
  .hist-stats { display: flex; flex-wrap: wrap; gap: 8px; }
  .hist-stats .chip { padding: 6px 12px; border-radius: 999px; background: var(--line); font-size: 13px; }
  .hist-stats .chip b { font-weight: 600; }
  .hist-now { text-align: center; color: var(--muted); font-size: 14px; min-height: 1.4em; }
  .hist-now b { color: var(--fg); font-size: 17px; font-weight: 600; margin-right: 6px; }
  #histSlider { width: 100%; height: 36px; accent-color: var(--accent); touch-action: pan-x; }
  .hist-empty { text-align: center; color: var(--muted); padding: 14px 6px; }
  .hist-dot { width: 14px; height: 14px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,.4); }
  .popup-btn { margin-top: 6px; display: block; width: 100%; padding: 7px 10px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 500; }

  /* ---- map markers ---- */
  .pin { position: relative; width: 40px; height: 40px; }
  .pin .dot { position: absolute; inset: 0; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 3px 10px rgba(0,0,0,.35); color: #fff; font-weight: 700; font-size: 16px; display: grid; place-items: center; }
  .pin .pulse { position: absolute; inset: 0; border-radius: 50%; background: var(--c); opacity: .35; animation: pulse 2.2s ease-out infinite; }
  .pin.stale .pulse { display: none; }
  @keyframes pulse { 0% { transform: scale(1); opacity: .45; } 100% { transform: scale(2.4); opacity: 0; } }
  .leaflet-popup-content-wrapper { border-radius: 14px; background: var(--surface-solid); color: var(--fg); }
  .leaflet-popup-tip { background: var(--surface-solid); }
  .leaflet-popup-content { margin: 12px 14px; font-family: inherit; font-size: 14px; line-height: 1.45; -webkit-user-select: text; user-select: text; }
  .tiles-road { filter: saturate(.85) contrast(.96); }
  @media (prefers-color-scheme: dark) { .tiles-road { filter: invert(1) hue-rotate(180deg) brightness(.9) contrast(.88) saturate(.7); } }
  .tiles-sat { filter: saturate(.95); }
  .tiles-topo { filter: saturate(.9); }
  @media (prefers-color-scheme: dark) { .tiles-topo { filter: brightness(.75) contrast(1.05); } }
  .fab.on { background: var(--accent); color: #fff; border-color: transparent; }
  .layer-menu { position: fixed; z-index: 950; right: calc(70px + var(--sar)); display: none; flex-direction: column; gap: 2px; padding: 6px; border-radius: 16px; min-width: 150px; }
  .layer-menu.open { display: flex; }
  .layer-menu button { text-align: left; padding: 10px 12px; border-radius: 10px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .layer-menu button:hover { background: var(--line); }
  .layer-menu button[aria-checked="true"] { font-weight: 600; color: var(--accent); }
  .layer-menu button[aria-checked="true"]::after { content: "✓"; margin-left: auto; }
  .me-dot { width: 18px; height: 18px; border-radius: 50%; background: #2563eb; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(37,99,235,.25), 0 2px 6px rgba(0,0,0,.4); }
  .popup-link { margin-top: 6px; display: block; text-align: center; padding: 7px 10px; border-radius: 10px; background: var(--line); color: var(--fg) !important; text-decoration: none; font-size: 13px; font-weight: 500; }
  .leaflet-control-zoom { display: none; }
  .leaflet-control-attribution { font-size: 10px; background: var(--surface) !important; color: var(--muted) !important; }
  .leaflet-control-attribution a { color: var(--muted) !important; }
  /* keep the attribution above the sheet on phones */
  .leaflet-bottom { bottom: var(--sheet-h); transition: bottom .28s cubic-bezier(.2,.8,.2,1); }

  /* ---- login ---- */
  #login { position: fixed; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(8,12,18,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #login form { width: 100%; max-width: 360px; background: var(--surface-solid); border-radius: 22px; padding: 26px 22px 22px; display: grid; gap: 14px; box-shadow: var(--shadow); text-align: center; }
  #login .logo { width: 52px; height: 52px; border-radius: 16px; margin: 0 auto; }
  #login .logo svg { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #login h2 { margin: 0; font-size: 18px; }
  #login p.sub { margin: -6px 0 0; color: var(--muted); font-size: 14px; }
  #login input { font: inherit; font-size: 16px; /* 16px stops iOS Safari from zooming the page on focus */ padding: 13px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--fg); text-align: center; -webkit-user-select: text; user-select: text; }
  #login input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  #login .err { margin: 0; color: var(--bad); min-height: 1.3em; font-size: 14px; }
  #login .go { background: var(--accent); color: #fff; padding: 13px; border-radius: 12px; font-weight: 600; }
</style>
</head>
<body>
<noscript>ต้องเปิด JavaScript เพื่อดูแผนที่</noscript>
<div id="map"></div>

<header class="topbar glass">
  <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></div>
  <div class="brand"><h1>Family Tracker</h1><small id="status" role="status" aria-live="polite">กำลังเชื่อมต่อ…</small></div>
</header>

<nav class="fabs" aria-label="เครื่องมือแผนที่">
  <button class="fab glass" id="refresh" type="button" aria-label="รีเฟรช" title="รีเฟรช"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg></button>
  <button class="fab glass" id="fit" type="button" aria-label="ดูทุกคนบนแผนที่" title="ดูทุกคน"><svg viewBox="0 0 24 24"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/></svg></button>
  <button class="fab glass" id="locate" type="button" aria-label="แสดงตำแหน่งของฉัน" aria-pressed="false" title="ตำแหน่งของฉัน"><svg viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-8-8-2z"/></svg></button>
  <button class="fab glass" id="layers" type="button" aria-label="เลือกชั้นแผนที่" aria-haspopup="true" aria-expanded="false" title="ชั้นแผนที่"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5M3 17.5l9 5 9-5"/></svg></button>
  <button class="fab glass" id="logout" type="button" aria-label="ออกจากระบบ" title="ออก"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
</nav>
<div class="layer-menu glass" id="layerMenu" role="menu" aria-label="ชั้นแผนที่"></div>

<section class="panel glass" id="panel" aria-label="รายชื่อสมาชิก">
  <div class="grab" id="grab" role="button" tabindex="0" aria-label="ลากเพื่อขยายหรือย่อรายชื่อ"><span></span></div>
  <div class="panel-head" id="head"><span><b id="count">0</b> คน<span id="silentCount"></span></span><span id="updated"></span></div>
  <div class="alerts" id="alerts"></div>
  <div class="people" id="people"></div>
  <div class="history" id="history" hidden>
    <div class="hist-bar">
      <button class="icon-btn" id="histBack" type="button" aria-label="กลับไปรายชื่อ"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <strong id="histName"></strong>
    </div>
    <div class="hist-date">
      <button class="icon-btn" id="histPrev" type="button" aria-label="วันก่อนหน้า"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <input type="date" id="histDate" aria-label="เลือกวันที่">
      <button class="icon-btn" id="histNext" type="button" aria-label="วันถัดไป"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
    <div class="hist-stats" id="histStats"></div>
    <input type="range" id="histSlider" min="0" max="0" value="0" aria-label="เลื่อนดูตามเวลา" disabled>
    <div class="hist-now" id="histNow"></div>
  </div>
</section>

<div id="login">
  <form id="loginForm">
    <div class="logo"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
    <h2>Family Tracker</h2>
    <p class="sub">ใส่ Token เพื่อดูตำแหน่งสมาชิก</p>
    <input id="token" type="password" autocomplete="current-password" placeholder="Token" required>
    <p class="err" id="loginError"></p>
    <button class="go" type="submit">เข้าดู</button>
  </form>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  var API = 'https://api.drivetodev.online/owntracks/';
  var REFRESH_MS = 30000, STALE_MS = 3600000, LIVE_MS = 600000;
  var KEY = 'familytracker.token', COLORS_KEY = 'familytracker.colors', SHEET_KEY = 'familytracker.sheet';
  var PALETTE = ['#2563eb', '#e11d48', '#16a34a', '#f59e0b', '#9333ea', '#0891b2', '#ea580c', '#db2777'];
  var $ = function (id) { return document.getElementById(id); };

  if (typeof L === 'undefined') {   // Leaflet's CDN is blocked or offline
    $('status').textContent = 'โหลดแผนที่ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วรีเฟรช';
    $('login').style.display = 'none';
    return;
  }

  var map = L.map('map', { zoomControl: false, attributionControl: true }).setView([13.75, 100.5], 11);
  var LAYERS = {
    road: { label: 'ถนน', cls: 'tiles-road', url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', opt: { maxZoom: 19, attribution: '&copy; OpenStreetMap' } },
    sat:  { label: 'ดาวเทียม', cls: 'tiles-sat', url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', opt: { maxZoom: 19, attribution: 'Tiles &copy; Esri' } },
    topo: { label: 'ภูมิประเทศ', cls: 'tiles-topo', url: 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', opt: { maxZoom: 17, subdomains: 'abc', attribution: '&copy; OpenStreetMap, SRTM | &copy; OpenTopoMap' } }
  };
  var LAYER_KEY = 'familytracker.layer', baseLayer = null, layerName = 'road';
  function setLayer(name) {
    if (!LAYERS[name]) name = 'road';
    var def = LAYERS[name];
    if (baseLayer) map.removeLayer(baseLayer);
    baseLayer = L.tileLayer(def.url, Object.assign({ className: def.cls }, def.opt)).addTo(map);
    baseLayer.bringToBack(); layerName = name;
    try { localStorage.setItem(LAYER_KEY, name); } catch (e) {}
    Array.prototype.forEach.call($('layerMenu').children, function (b) { b.setAttribute('aria-checked', String(b.dataset.layer === name)); });
  }
  Object.keys(LAYERS).forEach(function (k) {
    var b = document.createElement('button'); b.type = 'button'; b.dataset.layer = k; b.setAttribute('role', 'menuitemradio'); b.textContent = LAYERS[k].label;

  // Ask a person's phone to report now; it answers on its next post, so the list shows "waiting" and refreshes faster meanwhile.

      .then(function (r) {

        if (!r.ok) throw new Error('HTTP ' + r.status);

      if (r.status === 401) { setToken(''); showLogin('Token ไม่ถูกต้อง'); throw new Error('401'); }

      $('status').textContent = 'อัปเดตล่าสุด ' + t; $('updated').textContent = 'รีเฟรชทุก 30 วิ';
    }).catch(function (e) {
      if (e.message !== '401') $('status').textContent = 'โหลดไม่สำเร็จ ลองใหม่อีกครั้ง';
    }).then(function () { $('refresh').classList.remove('spin'); });
  }
  window.__refreshTracker = refresh;

  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    setToken($('token').value.trim()); $('token').value = '';
    $('login').style.display = 'none'; refresh();
  });
  $('histBack').addEventListener('click', closeHistory);
  $('histPrev').addEventListener('click', function () { if (histState) { histState.day = shiftDay(histState.day, -1); loadHistory(); } });
  $('histNext').addEventListener('click', function () { if (histState && histState.day < bangkokDay(0)) { histState.day = shiftDay(histState.day, 1); loadHistory(); } });
  $('histDate').addEventListener('change', function () {
    var v = this.value; if (!histState || !/^\d{4}-\d{2}-\d{2}$/.test(v)) return;
    histState.day = v > bangkokDay(0) ? bangkokDay(0) : v; loadHistory();
  });
  $('histSlider').addEventListener('input', function () { showScrub(+this.value); });
  $('refresh').addEventListener('click', refresh);
  $('fit').addEventListener('click', fitAll);
  $('logout').addEventListener('click', function () { setToken(''); firstFit = true; if (histState) closeHistory(); lastRows = []; renderAlerts([]); render([]); $('status').textContent = 'ออกจากระบบแล้ว'; showLogin(); });
  setInterval(function () { if (!document.hidden) refresh(); }, REFRESH_MS);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(); });

  // mobile browsers resize the viewport when the address bar hides or the phone rotates
  var resizeTimer;
  function onResize() { clearTimeout(resizeTimer); resizeTimer = setTimeout(function () { layoutSheet(); map.invalidateSize(); }, 120); }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  if (window.visualViewport) visualViewport.addEventListener('resize', onResize);
  window.addEventListener('load', function () { layoutSheet(); map.invalidateSize(); });
  refresh();
})();
</script>
</body>
</html>
